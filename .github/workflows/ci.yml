name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile src/server.py src/bin/pkexec
      - name: End to end tests (fake claude CLI, throwaway HOME)
        run: python -m unittest discover -s tests -v

  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the tray icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsystemd-dev
          gcc -O2 -Wall -Wextra -o /tmp/agents-web-tray tray/agents-web-tray.c -lsystemd -lm
      - name: Shell scripts
        run: |
          bash -n install.sh src/agents-web
          shellcheck -S warning install.sh src/agents-web
