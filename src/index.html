<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1917">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Agents</title>
<style>
:root{--col:860px;--fs:1;--code:rgba(0,0,0,.42);--code2:rgba(0,0,0,.3);--sh:rgba(0,0,0,.45);--brilho:#fff;--hk:#c792ea;--hs:#c3e88d;--hc:#737b8c;--hn:#f78c6c;--hf:#82aaff;--ht:#ffcb6b;--hl:#ff9e80;--hv:#89ddff;--hd:#ff8a8a;--bg:#000;--p1:rgba(10,10,10,.94);--p2:#121212;--p3:#1b1b1b;--bd:#232323;--bd2:#353535;--tx:#ececec;--mu:#8d8d8d;--mu2:#5f5f5f;--ac:#fff;--acs:#fff;--actx:#000;--tint:rgba(255,255,255,.08);--ok:#6fd38a;--er:#ff7b7b;--am:#e8c66a;--mono:ui-monospace,"JetBrains Mono","Cascadia Code","DejaVu Sans Mono",monospace;--ui:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;--resp:var(--ui);--raio:10px}
body[data-tema=claude]{--bg:#1a1917;--p1:rgba(33,32,30,.94);--p2:#262523;--p3:#302e2b;--bd:#363430;--bd2:#4a4741;--tx:#f3f0e8;--mu:#a9a397;--mu2:#77736a;--ac:#d97757;--acs:#e3896a;--actx:#fff;--tint:rgba(217,119,87,.14);--raio:14px}
body[data-tema=agy]{--bg:#05060a;--p1:rgba(10,12,20,.92);--p2:#10132a;--p3:#181c38;--bd:#1f2546;--bd2:#2f3863;--tx:#e9ecfa;--mu:#8e97be;--mu2:#5c6590;--ac:linear-gradient(100deg,#4285f4,#8b6cff 55%,#c46bff);--acs:#86a6ff;--actx:#fff;--tint:rgba(110,140,255,.14);--raio:12px}
*{box-sizing:border-box}
:root{color-scheme:dark}
body.claro{color-scheme:light;--ok:#24834a;--er:#c33d36;--am:#946a00;--sh:rgba(40,35,20,.16);--brilho:#111;--hk:#8839ef;--hs:#2f8a2f;--hc:#8b8f9c;--hn:#d2550a;--hf:#1e60e0;--ht:#a86a00;--hl:#c4310f;--hv:#0b7ea0;--hd:#d20f39}
body.claro[data-tema=claude]{--bg:#faf9f5;--p1:rgba(243,241,235,.94);--p2:#fff;--p3:#ebe8df;--bd:#e3dfd4;--bd2:#d0cbbe;--tx:#27251f;--mu:#6b675c;--mu2:#9a958a;--ac:#c96442;--acs:#bf5b38;--actx:#fff;--tint:rgba(201,100,66,.1);--code:#f3f1ea;--code2:#f3f1ea}
body.claro[data-tema=agy]{--bg:#f6f7fc;--p1:rgba(255,255,255,.88);--p2:#fff;--p3:#edf0fa;--bd:#dfe3f2;--bd2:#cad1ea;--tx:#191d30;--mu:#5a6283;--mu2:#8a91ad;--ac:linear-gradient(100deg,#3b78e7,#7c5cf5 55%,#b65cf0);--acs:#4769dc;--actx:#fff;--tint:rgba(71,105,220,.1);--code:#f2f4fb;--code2:#f2f4fb}
body.claro .fa{background:none}
body.claro .aur{opacity:.32}body.claro.trabalhando .aur{opacity:.5}
body.claro .clawd{opacity:.13}body.claro .ag-p{opacity:.11}body.claro.trabalhando .ag-p{opacity:.2}
body.claro dialog::backdrop{background:rgba(30,28,20,.35)}
*{scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track,*::-webkit-scrollbar-corner{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13.5px/1.5 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
body{transition:background-color .7s,color .7s}
body.arrastando #app{transition:none}
aside,header,#barra,.caixa,.m.u .corpo,.btn,.chip-sel,.item,details.tool,.cart,dialog,.seg,.sug{transition:background-color .6s,border-color .6s,color .6s,box-shadow .25s,opacity .2s}
button,select,input,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--bd2);background:var(--p2);color:var(--tx);font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acs)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);color:var(--actx);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.vermelho{background:#c4473f;color:#fff;border-color:transparent;font-weight:600}
.btn.vermelho:hover{background:#d4524a}
.btn.ic{width:32px;padding:0}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}
.btn.ghost:hover{background:var(--p3);color:var(--tx)}
.btn.sm{height:27px;padding:0 9px;font-size:12.5px;border-radius:8px}
.btn.sm.ic{width:27px;padding:0}
.btn.perigo:hover{border-color:var(--er);color:var(--er)}
.btn:disabled{opacity:.4;cursor:default}
.btn.girando svg{animation:roda .8s linear infinite}
input[type=text],select.campo{height:34px;background:var(--p1);border:1px solid var(--bd2);border-radius:9px;padding:0 10px;color:var(--tx);max-width:100%}
input[type=text]:focus,select.campo:focus{outline:none;border-color:var(--acs)}
input[type=checkbox]{accent-color:var(--acs);width:16px;height:16px;margin:0;flex:none}
option{background:var(--p2);color:var(--tx)}
a{color:var(--acs)}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--mu2)}
#app{position:relative;z-index:1;display:grid;grid-template-columns:var(--lado,284px) minmax(0,1fr);height:100%}

/* ---------------- background ---------------- */
#fundo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#fundo>div{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
body[data-tema=claude] #fundo .fc,body[data-tema=agy] #fundo .fa{opacity:1}
.fc{background:radial-gradient(ellipse at 75% 80%,rgba(217,119,87,.10),transparent 60%)}
.clawd-w{position:absolute;right:5vw;bottom:13vh;width:min(44vw,520px)}
.clawd-p{animation:boia 3.6s ease-in-out infinite}
.clawd{width:100%;display:block;fill:#d97757;opacity:.18;overflow:visible;transition:opacity .8s}
.clawd .braco-e{animation:acena-e 2.4s ease-in-out infinite}
.clawd .braco-d{animation:acena-d 2.4s ease-in-out infinite}
.clawd .perna-a{animation:pernaA .9s steps(2,jump-none) infinite}
.clawd .perna-b{animation:pernaB .9s steps(2,jump-none) infinite}
.clawd .palp{fill:#d97757;opacity:0;animation:pisca 5s infinite}
.clawd-s{position:absolute;left:12%;right:12%;bottom:-6%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(217,119,87,.25),transparent);animation:sombra 3.6s ease-in-out infinite}
body.trabalhando .clawd-w{animation:pula 1.1s cubic-bezier(.3,0,.4,1) infinite}
body.trabalhando .clawd{opacity:.3}
@keyframes boia{50%{transform:translateY(-2.2%)}}
@keyframes sombra{50%{transform:scaleX(.88);opacity:.6}}
@keyframes acena-e{50%{transform:translateY(-.45px)}}
@keyframes acena-d{50%{transform:translateY(.45px)}}
@keyframes pernaA{to{transform:translateY(-.35px)}}
@keyframes pernaB{from{transform:translateY(-.35px)}to{transform:translateY(0)}}
@keyframes pisca{0%,92%,100%{opacity:0}94%,97%{opacity:1}}
@keyframes pula{0%,100%{transform:translateY(0)}35%{transform:translateY(-6%)}55%{transform:translateY(0)}65%{transform:scaleY(.97)}}
.brilhos i{position:absolute;font-style:normal;color:#d97757;opacity:var(--o);font-size:var(--s);left:var(--x);top:var(--y);animation:gira var(--d) linear infinite,cintila calc(var(--d)/3) ease-in-out infinite alternate}
@keyframes gira{from{transform:rotate(0) translateY(0)}50%{transform:rotate(180deg) translateY(-18px)}to{transform:rotate(360deg) translateY(0)}}
@keyframes cintila{from{opacity:calc(var(--o)*.3)}to{opacity:var(--o)}}
.fa{background:radial-gradient(1px 1px at 12% 22%,#fff8,transparent),radial-gradient(1px 1px at 33% 71%,#fff6,transparent),radial-gradient(1px 1px at 58% 14%,#fff7,transparent),radial-gradient(1px 1px at 81% 41%,#fff5,transparent),radial-gradient(1.5px 1.5px at 92% 83%,#fff6,transparent),radial-gradient(1px 1px at 46% 52%,#fff4,transparent),radial-gradient(1px 1px at 7% 88%,#fff5,transparent),radial-gradient(1px 1px at 69% 93%,#fff4,transparent)}
.aur{position:absolute;width:80vmax;height:80vmax;border-radius:50%;opacity:.55;will-change:transform;transition:opacity 1s}
.aur.a1{left:-25vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(66,133,244,.32),transparent);animation:deriva1 26s ease-in-out infinite alternate}
.aur.a2{right:-30vmax;top:-10vmax;background:radial-gradient(closest-side,rgba(139,108,255,.28),transparent);animation:deriva2 32s ease-in-out infinite alternate}
.aur.a3{left:10vmax;bottom:-45vmax;background:radial-gradient(closest-side,rgba(52,168,83,.16),transparent);animation:deriva1 38s ease-in-out infinite alternate-reverse}
body.trabalhando .aur{opacity:.85}
@keyframes deriva1{to{transform:translate(12vmax,8vmax) scale(1.15)}}
@keyframes deriva2{to{transform:translate(-14vmax,10vmax) scale(.9)}}
.orbs i{position:absolute;bottom:-80px;left:var(--x);width:var(--s);height:var(--s);border-radius:var(--r);background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.85),var(--c) 38%,rgba(0,0,0,0) 72%);opacity:0;animation:sobe var(--d) linear infinite;animation-delay:var(--dl);will-change:transform}
.orbs i.anel::after{content:"";position:absolute;left:-45%;right:-45%;top:38%;bottom:38%;border:1.5px solid rgba(200,210,255,.45);border-radius:50%;transform:rotate(-18deg)}
@keyframes sobe{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:var(--o)}50%{transform:translate(var(--dx),-60vh) rotate(160deg)}92%{opacity:var(--o)}100%{transform:translate(0,-120vh) rotate(320deg);opacity:0}}
/* Antigravity symbol, each block levitates on its own phase */
.agl{position:relative;width:calc(var(--b)*12);height:calc(var(--b)*10);flex:none}
.agl i{position:absolute;width:calc(var(--b) + .6px);height:calc(var(--b) + .6px);left:calc(var(--c)*var(--b));top:calc(var(--r)*var(--b));background:var(--k);animation:levita 4.4s ease-in-out infinite;animation-delay:calc(var(--c)*-.2s + var(--r)*-.09s)}
.agl.parado i{animation:none}
.agl.rapido i{animation:levita2 1.05s ease-in-out infinite;animation-delay:calc(var(--c)*-.09s)}
@keyframes levita{50%{transform:translateY(calc(var(--b)*-.22))}}
@keyframes levita2{50%{transform:translateY(calc(var(--b)*-.7))}}
.agl b{position:absolute;width:var(--b);height:var(--b);left:calc(var(--c)*var(--b));top:calc(var(--r)*var(--b));background:var(--k);opacity:0;animation:solta var(--d) ease-out infinite;animation-delay:var(--dl)}
@keyframes solta{0%,70%{opacity:0;transform:translateY(0)}72%{opacity:.9}100%{opacity:0;transform:translateY(calc(var(--b)*-5)) rotate(70deg) scale(.5)}}
.ag-w{position:absolute;right:6vw;bottom:15vh;--b:min(3.4vw,40px)}
.ag-p{animation:flutua 6.5s ease-in-out infinite;opacity:.3;transition:opacity 1s}
.ag-s{position:absolute;left:5%;right:5%;bottom:calc(var(--b)*-1.6);height:calc(var(--b)*.9);border-radius:50%;background:radial-gradient(closest-side,rgba(110,140,255,.35),transparent);animation:sombra2 6.5s ease-in-out infinite}
.ag-g{position:absolute;inset:-35%;background:radial-gradient(closest-side,rgba(245,144,48,.16),rgba(96,118,218,.12) 55%,transparent);animation:pulsa 6.5s ease-in-out infinite}
body.trabalhando .ag-p{opacity:.5}
body.trabalhando .ag-g{animation-duration:1.6s}
@keyframes flutua{50%{transform:translateY(-4.5%)}}
@keyframes sombra2{50%{transform:scaleX(.8);opacity:.55}}
@keyframes pulsa{50%{opacity:.55;transform:scale(1.08)}}
/* Claude spark mark */
svg.spark{flex:none;overflow:visible}
svg.spark g{stroke:#d97757;stroke-width:2.4;stroke-linecap:round;transform-origin:12px 12px}
svg.spark.lento g{animation:roda 14s linear infinite}
svg.spark.vivo g{animation:respira 1.6s cubic-bezier(.45,0,.2,1) infinite}
svg.spark.vivo line{animation:raio 1.6s ease-in-out infinite;animation-delay:calc(var(--n)*-.2s)}
@keyframes roda{to{transform:rotate(360deg)}}
@keyframes respira{0%{transform:rotate(0) scale(.82)}50%{transform:rotate(90deg) scale(1.08)}100%{transform:rotate(180deg) scale(.82)}}
@keyframes raio{50%{opacity:.35}}
/* theme switch wave */
.onda{position:fixed;inset:0;z-index:60;pointer-events:none;animation:onda .95s cubic-bezier(.2,.7,.2,1) forwards}
.onda.claude{background:radial-gradient(circle at var(--x) var(--y),rgba(217,119,87,.55),rgba(217,119,87,.18) 35%,rgba(27,26,24,0) 70%)}
.onda.agy{background:radial-gradient(circle at var(--x) var(--y),rgba(134,166,255,.55),rgba(139,108,255,.2) 35%,rgba(5,6,10,0) 70%)}
@keyframes onda{from{clip-path:circle(0 at var(--x) var(--y));opacity:1}60%{opacity:.85}to{clip-path:circle(150vmax at var(--x) var(--y));opacity:0}}
body.troca main{animation:entra .55s ease-out}
@keyframes entra{from{opacity:.35;transform:translateY(6px)}}
body.sem-anim *,body.sem-anim *::after,body.sem-anim *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::after,*::before{animation:none!important}}

/* ---------------- sidebar ---------------- */
aside{position:relative;border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--p1)}
#arrasta{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:5;touch-action:none}
#arrasta::after{content:"";position:absolute;top:0;bottom:0;left:3px;width:2px;background:var(--acs);opacity:0;transition:opacity .15s}
#arrasta:hover::after,#arrasta.ativo::after,#arrasta:focus-visible::after{opacity:.7}
#arrasta:focus{outline:none}
body.arrastando{cursor:col-resize;user-select:none}
body.arrastando *{cursor:col-resize!important}
.marca{display:flex;align-items:center;gap:9px;padding:10px 12px 6px}
.marca .logo{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--p3);border:1px solid var(--bd2)}
.marca b{font-size:14px;font-weight:650;letter-spacing:-.01em}
.marca small{display:block;color:var(--mu2);font-size:10.5px;margin-top:-3px}
.lado-acoes{padding:2px 10px 2px;display:flex;flex-direction:column;gap:6px}
.lado-acoes .btn.pri{width:100%;height:32px}
.lado-acoes .busca input{height:30px;font-size:12.5px}
.lado-acoes .busca svg{top:7px}
#filtros{padding:2px}#filtros button{height:23px}
.busca{position:relative}
.busca svg{position:absolute;left:10px;top:9px;color:var(--mu2)}
.busca input{width:100%;padding-left:32px}
.seg{display:inline-flex;padding:3px;border:1px solid var(--bd);border-radius:11px;background:var(--p1);gap:2px}
.seg button{border:0;background:transparent;height:27px;padding:0 11px;border-radius:8px;color:var(--mu);display:inline-flex;gap:7px;align-items:center;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--p3);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.35)}
#filtros{display:flex}#filtros button{flex:1;justify-content:center;font-size:12.5px}
.lista-cab{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0 16px}
#lista{flex:1;overflow:auto;padding:0 6px 6px}
.grupo{padding:8px 8px 2px}
.grupo.fix{display:flex;align-items:center;gap:5px}
.item{position:relative;padding:5px 6px 5px 7px;border-radius:8px;cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:0 8px;border:1px solid transparent;align-items:center}
.item:hover{background:var(--p2)}
.item.on{background:var(--tint);border-color:var(--bd2)}
.item .av,.item .chk{grid-row:1/span 2}
.item .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:12.5px;line-height:1.35}
.item .sub{color:var(--mu);font-size:10.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .del{position:absolute;right:4px;top:50%;transform:translateY(-50%);opacity:0;width:24px;height:24px;background:var(--p3)!important;border-radius:7px}
.item.on .del{background:var(--p3)!important}
.item .term{display:inline-flex;vertical-align:-2px;margin-right:5px;color:var(--mu)}
.menu-ctx{position:fixed;z-index:60;min-width:176px;background:var(--p2);border:1px solid var(--bd2);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.45);display:flex;flex-direction:column}
.menu-ctx button{all:unset;display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--tx)}
.menu-ctx button:hover,.menu-ctx button:focus-visible{background:var(--p3)}.menu-ctx button.perigo{color:var(--er)}
.menu-ctx small{display:block;padding:4px 10px 6px;color:var(--mu);font-size:11px;max-width:220px;line-height:1.4}
.item:hover .del,.item .del:focus{opacity:1}
.item .del:hover{color:var(--tx)}
@media (hover:none){.item{grid-template-columns:20px 1fr auto}.item .del{position:static;transform:none;opacity:.55;grid-column:3;grid-row:1/span 2;background:transparent!important}}
.selecionando .item .del{display:none}
.item.marcado{background:var(--tint);border-color:var(--acs)}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--bd2);display:grid;place-items:center;color:transparent;margin-left:1px}
.item.marcado .chk{background:var(--acs);border-color:var(--acs);color:#111}
#massa{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--bd);background:var(--p2);animation:surge .2s ease-out}
#massa[hidden]{display:none}
#massa .n{flex:1;font-weight:600;font-size:12.5px}
.av{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--p3);border:1px solid var(--bd);flex:none}
.av.g{width:30px;height:30px;border-radius:9px}
.vivo-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 0 0 rgba(111,211,138,.6);animation:ping 1.4s infinite;vertical-align:1px}
@keyframes ping{70%{box-shadow:0 0 0 6px rgba(111,211,138,0)}100%{box-shadow:0 0 0 0 rgba(111,211,138,0)}}
#uso{border-top:1px solid var(--bd);padding:6px 12px 2px}
#uso .uso-cab{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;margin-bottom:4px}
#uso .uso-cab svg{transition:transform .2s;color:var(--mu2)}
#uso.fechado .uso-cab svg{transform:rotate(-90deg)}
#uso.fechado .uso-corpo{display:none}
.uso-corpo{display:flex;flex-direction:column;gap:9px;max-height:34vh;overflow:auto;padding-bottom:4px}
.medidor{font-size:11.5px;color:var(--mu)}
.medidor .lin{display:flex;justify-content:space-between;gap:8px;align-items:center}
.medidor .lin b{color:var(--tx);font-weight:600;display:flex;gap:6px;align-items:center}
.medidor .lin .v{font-family:var(--mono);font-size:11px}
.barra-m{height:5px;background:var(--p3);border-radius:3px;overflow:hidden;margin:3px 0 4px}
.barra-m u{display:block;height:100%;background:var(--ac);text-decoration:none;border-radius:3px;transition:width .6s}
.barra-m u.alto{background:var(--am)}.barra-m u.critico{background:var(--er)}
nav.rodape{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:4px 6px 6px}
nav.rodape .btn{flex-direction:column;height:auto;padding:5px 0;gap:2px;font-size:10px;font-weight:500;border-color:transparent;background:transparent;color:var(--mu)}
nav.rodape .btn:hover{background:var(--p2);color:var(--tx)}
nav.rodape .btn.on{color:var(--acs)}

/* ---------------- header ---------------- */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{border-bottom:1px solid var(--bd);background:var(--p1);padding:10px 16px 10px;display:flex;flex-direction:column;gap:9px}
.h1{display:flex;align-items:center;gap:10px;min-width:0}
#menuBtn{display:none}
#titulo{flex:1;min-width:80px;font-size:15px;font-weight:600;background:transparent;border:1px solid transparent;height:32px;padding:0 8px;border-radius:8px;color:var(--tx)}
#titulo:hover{border-color:var(--bd)}
#titulo:focus{border-color:var(--bd2);outline:none;background:var(--p1)}
#agSeg button.on[data-a=claude]{background:rgba(217,119,87,.18);color:#f3c2ae}
#agSeg button.on[data-a=agy]{background:rgba(110,140,255,.18);color:#c9d6ff}
body.claro #agSeg button.on[data-a=claude]{color:#a4472a}body.claro #agSeg button.on[data-a=agy]{color:#3557c9}
.h2{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.h2::-webkit-scrollbar{display:none}
.h2:empty{display:none}
.chip-sel{position:relative;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px 0 10px;border:1px solid var(--bd);border-radius:999px;background:var(--p2);color:var(--mu);font-size:12.5px;white-space:nowrap;flex:none}
.chip-sel:hover{border-color:var(--bd2)}
.chip-sel select{appearance:none;-webkit-appearance:none;background:transparent;border:0;color:var(--tx);font-weight:500;padding:0 14px 0 0;cursor:pointer;max-width:210px;text-overflow:ellipsis}
.chip-sel select:focus{outline:none}
.chip-sel select:disabled{color:var(--mu);cursor:default}
.chip-sel .chev{position:absolute;right:8px;pointer-events:none;width:12px;height:12px;color:var(--mu2)}
.chip-sel.btnc{cursor:pointer;color:var(--tx);font:500 12.5px var(--mono)}
.chip-sel.btnc:disabled{color:var(--mu);cursor:default}

/* ---------------- messages ---------------- */
#msgs{flex:1;overflow:auto;padding:22px 18px 40px}
.col{max-width:var(--col);margin:0 auto}
.vazio{text-align:center;margin:12vh auto 0;max-width:640px;animation:entra .6s ease-out}
.vazio .marca-g{display:grid;place-items:center;margin-bottom:18px}
.vazio h2{font-weight:500;margin:0 0 8px;font-size:32px;letter-spacing:-.02em}
body[data-tema=claude] .vazio h2{font-family:var(--resp);font-weight:400}
body[data-tema=agy] .vazio h2{background:var(--ac);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
.vazio p{color:var(--mu);margin:0 0 26px}
.sugs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.sug{border:1px solid var(--bd);background:var(--p1);border-radius:var(--raio);padding:12px 13px;cursor:pointer;color:var(--tx);font-size:13px;display:flex;flex-direction:column;gap:8px;text-align:left;align-items:flex-start}
.sug svg{color:var(--acs)}
.sug:hover{border-color:var(--acs);transform:translateY(-2px);transition:transform .2s,border-color .2s}
.m{margin:0 0 22px}
.m.novo{animation:surge .4s cubic-bezier(.2,.8,.3,1)}
@keyframes surge{from{opacity:0;transform:translateY(10px)}}
.cab-m{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12.5px;color:var(--mu)}
.cab-m b{color:var(--tx);font-weight:600}
.badge{font:500 11px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid var(--bd2);color:var(--mu)}
.m.u{display:flex;flex-direction:column;align-items:flex-end}
.m.u .corpo{background:var(--p2);border:1px solid var(--bd);border-radius:var(--raio) var(--raio) 4px var(--raio);padding:10px 14px;white-space:pre-wrap;word-wrap:break-word;max-width:82%;font-size:calc(14px*var(--fs))}
.m.a .corpo{word-wrap:break-word;font-family:var(--resp);font-size:calc(14.5px*var(--fs));line-height:1.65;padding-left:30px}
body[data-tema=claude] .m.a .corpo{font-size:calc(15.5px*var(--fs));line-height:1.7}
.m.a>details,.m.a>.think,.m.a>.meta,.m.a>.erro,.m.a>.ferrs{margin-left:30px}
.corpo>:first-child{margin-top:0}.corpo>:last-child{margin-bottom:0}
.corpo p{margin:.55em 0}
.corpo h1,.corpo h2,.corpo h3,.corpo h4{margin:1em 0 .4em;line-height:1.25;font-family:var(--ui);font-weight:600}
.corpo h1{font-size:1.3em}.corpo h2{font-size:1.16em}.corpo h3{font-size:1.04em}
.corpo ul,.corpo ol{margin:.4em 0;padding-left:1.4em}
.corpo li{margin:.15em 0}
.corpo blockquote{margin:.5em 0;padding:2px 12px;border-left:3px solid var(--acs);color:var(--mu)}
.corpo code{font:12.5px var(--mono);background:var(--p3);padding:1.5px 5px;border-radius:5px}
.corpo pre{position:relative;background:var(--code);border:1px solid var(--bd);border-radius:var(--raio);padding:36px 12px 12px;overflow:auto;max-height:560px;font-family:var(--mono)}
.corpo pre .ling{position:absolute;top:8px;left:12px;font:500 11px var(--ui);color:var(--mu2);text-transform:uppercase;letter-spacing:.06em}
.corpo pre code{background:none;padding:0;font-size:calc(12.5px*var(--fs));line-height:1.55}
.corpo pre .acp{position:absolute;top:5px;right:6px;display:flex;gap:4px}
.corpo pre .acp .btn{height:24px;padding:0 8px;font:500 11.5px var(--ui);background:var(--p2);border-color:var(--bd)}
.corpo pre .acp .btn.on{color:var(--acs);border-color:var(--acs)}
.corpo pre.quebra code{white-space:pre-wrap;word-break:break-word}
.hk{color:var(--hk)}.hs{color:var(--hs)}.hc{color:var(--hc);font-style:italic}.hn{color:var(--hn)}.hf{color:var(--hf)}.ht{color:var(--ht)}.hl{color:var(--hl)}.hv{color:var(--hv)}.hd{color:var(--hd)}
.corpo table{border-collapse:collapse;margin:.7em 0;display:block;overflow:auto;font:13.5px var(--ui)}
.corpo th,.corpo td{border:1px solid var(--bd2);padding:5px 10px;text-align:left}
.corpo th{background:var(--p2);font-weight:600}
.corpo hr{border:0;border-top:1px solid var(--bd2);margin:1em 0}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.meta span{font:11px var(--mono);color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:1px 7px;background:var(--p1)}
.meta span b{color:var(--mu2);font-weight:500;margin-right:4px;font-family:var(--ui);text-transform:uppercase;font-size:9.5px;letter-spacing:.06em}
.meta .btn{height:22px;width:22px;padding:0;border-radius:6px}
.erro{color:var(--er);font:12.5px var(--mono);white-space:pre-wrap;margin:8px 0;padding:8px 10px;border:1px solid rgba(255,123,123,.3);border-radius:8px;background:rgba(255,80,80,.06)}
.aviso{color:var(--am);font-size:12px;margin:6px 0;padding:7px 10px;border:1px solid rgba(232,198,106,.25);border-radius:8px;background:rgba(232,198,106,.06);display:flex;gap:8px;align-items:flex-start}
/* tools */
.ferrs{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.m.a>.pks{margin-left:30px}.pks:empty{display:none}
.pk{border:1px solid rgba(232,198,106,.4);background:rgba(232,198,106,.06);border-radius:12px;padding:12px 14px;margin:6px 0 10px}
.pk .t{display:flex;gap:8px;align-items:center;font-weight:600;color:var(--am);font-size:13.5px}
.troca-n{display:flex;gap:8px;align-items:center;margin:6px 0 10px 30px;padding:8px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--p1);color:var(--mu);font-size:12.5px}
.troca-n svg{color:var(--acs);flex:none}
.troca-n b{color:var(--tx);font-weight:600}
.cab-m .auto{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--p3);color:var(--mu)}
.pk.lim .ctx{display:block;margin-top:8px;color:var(--mu)}
.pk.lim .auto-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--mu);font-size:12px}
.pk .cmd{font:12.5px var(--mono);background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:8px 0;white-space:pre-wrap;word-break:break-all;color:var(--tx)}
.pk .f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pk .f input{flex:1;min-width:150px;height:34px}
.pk small{display:block;color:var(--mu);font-size:11.5px;margin-top:8px;line-height:1.45}
.pk.fim{padding:7px 12px;background:transparent;border-color:var(--bd);display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mu);flex-wrap:wrap}
.pk.fim .cmd{display:inline;margin:0;padding:1px 6px;border:0}.pk.fim.ok{border-color:rgba(111,211,138,.35)}.pk.fim.ruim{border-color:rgba(255,123,123,.3)}
.pk-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--am);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(232,198,106,.18)}
.pk.ask{border-color:color-mix(in srgb,var(--acs) 45%,transparent);background:color-mix(in srgb,var(--acs) 6%,transparent)}
.pk.ask>.t{color:var(--acs)}
.pk .desc{font-size:13px;margin-top:4px}
.pk .json{font:12px var(--mono);background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin:8px 0;white-space:pre-wrap;word-break:break-all;max-height:240px;overflow:auto}
.pk .q{margin:10px 0 4px}.pk .q .hd{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.pk .q .qt{font-weight:600;margin:3px 0 8px;font-size:14px}
.pk .ops{display:grid;gap:6px}
.pk .op{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--p2);border-radius:9px;padding:8px 11px;color:var(--tx);cursor:pointer;font:inherit;font-size:13px}
.pk .op small{margin-top:2px}.pk .op:hover{border-color:var(--bd2)}.pk .op.on{border-color:var(--acs);background:var(--tint)}
.pk .plano{max-height:380px;overflow:auto;background:var(--p2);border:1px solid var(--bd);border-radius:8px;padding:2px 14px;margin:8px 0;font-size:13.5px}
.pk.fim details{width:100%}.pk.fim summary{cursor:pointer}.pk.fim .resp{color:var(--tx)}
.diff{border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin:8px 0;background:var(--p2)}
.diff .dcab{display:flex;gap:8px;align-items:center;padding:6px 10px;font:12px var(--mono);color:var(--mu);border-bottom:1px solid var(--bd)}
.diff .dcab span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.diff .dcab em{font-style:normal;font-size:11px;color:var(--ok)}
.dmais{color:var(--ok);font-weight:600}.dmenos{color:var(--er);font-weight:600}
.dstat{font:11px var(--mono);flex:none}
.dcorpo{max-height:420px;overflow:auto;font:12px/1.5 var(--mono)}
.dl{display:grid;grid-template-columns:4.5ch 4.5ch 2ch 1fr;min-width:max-content}
.dl .n{padding:0 6px 0 0;text-align:right;color:var(--mu2);user-select:none}
.dl .s{text-align:center;user-select:none;color:var(--mu2)}
.dl .c{white-space:pre;padding-right:12px}
.dl.add{background:rgba(111,211,138,.13)}.dl.add .s{color:var(--ok)}
.dl.del{background:rgba(255,123,123,.13)}.dl.del .s{color:var(--er)}
.dsep{padding:2px 10px;color:var(--mu2);background:var(--p3);font-size:11px}
.acoes-m{display:flex;gap:2px;margin-top:3px;opacity:0;transition:opacity .15s}
.m.u:hover .acoes-m,.m.u:focus-within .acoes-m{opacity:1}
@media (hover:none){.acoes-m{opacity:.75}}
.acoes-m .btn,.meta .btn.txt{height:24px;width:auto;padding:0 8px;font-size:11.5px;gap:5px;color:var(--mu)}
.m.u .editor{width:min(620px,100%);display:flex;flex-direction:column;gap:8px}
.m.u .editor textarea{width:100%;min-height:90px;resize:vertical;background:var(--p2);color:var(--tx);border:1px solid var(--acs);border-radius:var(--raio);padding:10px 14px;font:inherit;font-size:14px}
.m.u .editor .f{display:flex;gap:8px;justify-content:flex-end;align-items:center}.m.u .editor small{color:var(--mu);font-size:11.5px;flex:1}
.btn.forget{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.notas{margin:8px 0;border:1px solid var(--bd);border-radius:10px;padding:6px 12px;background:var(--p2)}details.notas summary{cursor:pointer;font-size:13px}
details.tool{border:1px solid var(--bd);border-radius:10px;background:var(--p1);overflow:hidden}
details.tool.novo{animation:surge .3s ease-out}
details.tool summary{display:flex;align-items:center;gap:9px;padding:7px 10px;cursor:pointer;list-style:none;min-width:0}
details.tool summary::-webkit-details-marker{display:none}
details.tool .tic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--p3);color:var(--acs);flex:none}
details.tool .tnome{font:600 12.5px var(--mono);flex:none}
details.tool .tres{color:var(--mu);font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;flex:none}
.pill.run{color:var(--am);background:rgba(232,198,106,.1)}
.pill.ok{color:var(--ok);background:rgba(111,211,138,.1)}
.pill.err{color:var(--er);background:rgba(255,123,123,.1)}
.anel-g{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:roda .7s linear infinite}
.tbody{border-top:1px solid var(--bd);padding:8px 10px 10px}
.tbody pre{margin:4px 0 10px;font:11.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;color:var(--mu);background:var(--code2);border-radius:7px;padding:8px}
/* thinking */
details.pens{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--p1);position:relative;overflow:hidden}
details.pens summary{display:flex;gap:8px;align-items:center;padding:7px 11px;cursor:pointer;list-style:none;color:var(--mu);font-size:12.5px;font-weight:500}
details.pens summary::-webkit-details-marker{display:none}
details.pens .ptxt{white-space:pre-wrap;padding:2px 14px 12px;color:var(--mu);font-size:13px;font-style:italic;max-height:260px;overflow:auto;font-family:var(--resp)}
details.pens.vivo::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,transparent,var(--acs),transparent);background-size:100% 200%;animation:varre 1.4s linear infinite}
@keyframes varre{from{background-position:0 100%}to{background-position:0 -100%}}
.think{display:flex;align-items:center;gap:12px;margin:4px 0 6px;color:var(--mu)}
.think .tm{width:30px;height:30px;display:grid;place-items:center}
.think .tt1{display:flex;flex-direction:column;line-height:1.3}
.shimmer{font-weight:600;font-size:14px;background:linear-gradient(90deg,var(--mu) 0%,var(--mu) 35%,var(--brilho) 50%,var(--mu) 65%,var(--mu) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:reluz 1.7s linear infinite}
body[data-tema=claude] .shimmer{background-image:linear-gradient(90deg,#c46a4c 0%,#c46a4c 32%,#ffd2c0 50%,#c46a4c 68%,#c46a4c 100%)}
body[data-tema=agy] .shimmer{background-image:linear-gradient(90deg,#6f7bb0 0%,#6f7bb0 28%,#9fb8ff 42%,#f0c3ff 52%,#ffd59a 60%,#6f7bb0 72%,#6f7bb0 100%)}
body.claro[data-tema=claude] .shimmer{background-image:linear-gradient(90deg,#b4583a 0%,#b4583a 32%,#f0b49c 50%,#b4583a 68%,#b4583a 100%)}
body.claro[data-tema=agy] .shimmer{background-image:linear-gradient(90deg,#5866a8 0%,#5866a8 28%,#7f9cff 42%,#c77dff 52%,#f0a030 60%,#5866a8 72%,#5866a8 100%)}
@keyframes reluz{from{background-position:110% 0}to{background-position:-110% 0}}
.verbo-anim{animation:troca-verbo .35s ease-out}
@keyframes troca-verbo{from{opacity:0;transform:translateY(5px)}}
.think small{font:11.5px var(--mono);color:var(--mu2)}
.pontos{display:inline-flex;gap:4px;margin-left:6px;vertical-align:2px}
.pontos i{width:5px;height:5px;border-radius:50%;background:var(--k);animation:salta 1s ease-in-out infinite;animation-delay:calc(var(--n)*.14s)}
@keyframes salta{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.skel{display:flex;flex-direction:column;gap:9px;margin:10px 0 4px 30px}
.skel i{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--p2) 0%,var(--p3) 40%,var(--tint) 50%,var(--p3) 60%,var(--p2) 100%);background-size:250% 100%;animation:reluz 1.5s linear infinite}
.skel i:nth-child(1){width:88%}.skel i:nth-child(2){width:72%;animation-delay:-.2s}.skel i:nth-child(3){width:46%;animation-delay:-.4s}
.cursor{display:inline-block;width:.5em;height:1.05em;vertical-align:-2px;background:var(--acs);margin-left:2px;animation:pis .6s infinite alternate;border-radius:2px}
@keyframes pis{to{opacity:.2}}
.anx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;justify-content:flex-end}
.anx img{max-height:150px;max-width:230px;border-radius:10px;border:1px solid var(--bd2);display:block}
.anx video{max-height:190px;max-width:320px;border-radius:10px}
.arq{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--bd2);border-radius:8px;padding:4px 9px;background:var(--p2);text-decoration:none;color:var(--tx)}

/* ---------------- stats + composer ---------------- */
#barra{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 18px;border-top:1px solid var(--bd);font-size:12px;color:var(--mu);background:var(--p1)}
#barra:empty{display:none}
#barra .st1{display:inline-flex;align-items:center;gap:6px}
#barra .st1 b{font:500 12px var(--mono);color:var(--tx)}
.ctxm{display:inline-block;width:100px;height:6px;background:var(--p3);border-radius:3px;overflow:hidden}
.ctxm u{display:block;height:100%;background:var(--ac);text-decoration:none;transition:width .5s}
#comp{padding:10px 18px 14px;background:var(--p1)}
.caixa{position:relative;max-width:var(--col);margin:0 auto;border:1px solid var(--bd2);border-radius:calc(var(--raio) + 4px);background:var(--bg);padding:8px 8px 8px 12px}
.caixa:focus-within{border-color:var(--acs)}
body[data-tema=claude] .caixa:focus-within{box-shadow:0 0 0 3px rgba(217,119,87,.15)}
body[data-tema=agy] .caixa:focus-within{box-shadow:0 0 0 1px #86a6ff44,0 0 28px rgba(66,133,244,.22)}
#comp.arrasto .caixa{border-style:dashed;border-color:var(--acs);background:var(--tint)}
#pend{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 6px}
#pend:empty{display:none}
#pend .arq{animation:surge .25s ease-out}
#pend .arq button{border:0;background:none;color:var(--mu);cursor:pointer;padding:0;display:grid}
#pend .arq .prog{font:11px var(--mono);color:var(--mu)}
#txt{width:100%;resize:none;background:transparent;border:0;padding:6px 2px;min-height:26px;max-height:40vh;line-height:1.5;font-size:calc(14.5px*var(--fs));display:block}
#txt:focus{outline:none}
.acoes{display:flex;align-items:center;gap:8px;margin-top:4px}
.acoes .dica{flex:1;font-size:11.5px;color:var(--mu2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#envBtn,#parBtn{width:34px;height:34px;border-radius:10px;padding:0}
#parBtn svg{fill:currentColor;stroke:none}
/* dialogs */
dialog{background:var(--p2);color:var(--tx);border:1px solid var(--bd2);border-radius:16px;padding:0;width:min(660px,94vw);max-height:88vh;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog.largo{width:min(900px,96vw)}
dialog.estreito{width:min(460px,94vw)}
dialog[open]{animation:surge .25s ease-out}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--bd)}
.dh h3{flex:1;margin:0;font-size:15px;font-weight:600}
#dlgExtra{display:flex;gap:8px;align-items:center}
.db{padding:14px 16px 16px;overflow:auto;max-height:calc(88vh - 60px)}
.db .nota{color:var(--mu);font-size:12.5px;margin:10px 0 0}
.cart{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--p1)}
.cart .n{flex:1 1 220px;min-width:0}
.cart .n .t{font-weight:600;display:flex;gap:8px;align-items:center}
.cart .n small{display:block;color:var(--mu);font:11.5px var(--mono);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estado{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px}

/* ---------- keyboard shortcuts ---------- */
const ATALHOS=[["Chats",[[["Ctrl","K"],"Search chats and messages"],[["Ctrl","Shift","O"],"New chat with the same agent and account"],[["Alt","↑"],"Previous chat in the list"],[["Alt","↓"],"Next chat in the list"],[["Ctrl","B"],"Show or hide the chat list"]]],
 ["Writing",[[["Enter"],"Send"],[["Shift","Enter"],"New line"],[["/"],"Saved prompts, in an empty message"],[["Ctrl","Enter"],"Send an edited message"],[["Esc"],"Close menus, dialogs and the image viewer"]]],
 ["Page",[[["/"],"Jump to the message box"],[["Ctrl",","],"Settings"],[["?"],"Show this list"]]]];
function dlgAtalhos(){
 abreDlg("Keyboard shortcuts","estreito");const B=$("#dlgB"),g=el("div",{class:"atalhos"});
 const mac=/Mac|iP(hone|ad)/.test(navigator.platform||"");
 for(const[sec,ls]of ATALHOS){g.append(el("div",{class:"lbl sec"},sec));
  for(const[ks,t]of ls){const k=el("div",{class:"k"});ks.forEach((x,i)=>{if(i)k.append("+");k.append(el("kbd",{},mac&&x==="Ctrl"?"⌘":x))});g.append(el("div",{},t),k)}}
 B.append(g);
}
document.addEventListener("keydown",e=>{
 if(e.defaultPrevented||dlg.open||document.getElementById("zoom"))return;
 const mod=e.ctrlKey||e.metaKey,k=(e.key||"").toLowerCase(),campo=e.target&&e.target.closest&&e.target.closest("input,textarea,select,[contenteditable=true]");
 if(mod&&!e.shiftKey&&!e.altKey&&k==="b"){e.preventDefault();alternaLado();return}
 if(mod&&e.shiftKey&&!e.altKey&&k==="o"){e.preventDefault();novoChat().catch(er=>toast(cap(er.message)));return}
 if(mod&&!e.shiftKey&&!e.altKey&&k===","){e.preventDefault();ajustes();return}
 if(mod&&!e.altKey&&k==="/"){e.preventDefault();dlgAtalhos();return}
 /* in a field with text, Alt+arrows stays cursor movement (Option+Up/Down on a Mac) */
 if(e.altKey&&!mod&&!e.shiftKey&&(k==="arrowup"||k==="arrowdown")&&!(campo&&campo.value)){e.preventDefault();vizinho(k==="arrowup"?-1:1);return}
 if(e.key==="Escape"&&$("#lado").classList.contains("aberto")&&(!campo||e.target.id==="busca")){$("#lado").classList.remove("aberto");return}
 if(campo||mod||e.altKey)return;
 if(e.key==="?"){e.preventDefault();dlgAtalhos()}
 else if(e.key==="/"){e.preventDefault();$("#txt").focus()}
});

/* ---------- filters / start ---------- */
[...$("#filtros").children].forEach(b=>b.onclick=()=>{[...$("#filtros").children].forEach(x=>x.classList.remove("on"));b.classList.add("on");FILTRO=b.dataset.f;desenharLista()});
$("#busca").oninput=()=>{clearTimeout(buscaT);const q=$("#busca").value.trim();if(q.length<2){BUSCA=null;desenharLista();return}desenharLista();
 buscaT=setTimeout(async()=>{try{const r=await api("/api/busca?q="+encodeURIComponent(q));if($("#busca").value.trim()===q){BUSCA={q,r};desenharLista()}}catch{}},220)};
document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&e.key.toLowerCase()==="k"&&!dlg.open){e.preventDefault();ladoFlutuante(true)}});
$("#busca").addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#busca").value){e.preventDefault();e.stopPropagation();$("#busca").value="";$("#busca").oninput();$("#txt").focus()}});
$("#menuBtn").onclick=e=>{e.stopPropagation();$("#lado").classList.toggle("aberto")};
document.addEventListener("click",e=>{const l=$("#lado");if(l.classList.contains("aberto")&&!l.contains(e.target)&&!e.target.closest("#menuBtn,#trilho,#menuCtx,dialog"))l.classList.remove("aberto")});
setInterval(()=>{if(document.visibilityState==="visible"||EST.chats.some(c=>c.rodando))carregarEstado()},10000);
setInterval(()=>{if(document.visibilityState==="visible")carregarUso()},120000);
setInterval(()=>{if(document.visibilityState==="visible"&&USO)desenharUso()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(CHAT&&NOVOS.delete(CHAT.id)){salvaNovos();desenharLista()}carregarEstado();if(CHAT&&!ES)api("/api/chats/"+CHAT.id).then(c=>{if(c.rodando||c.mensagens.length!==CHAT.mensagens.length)abrir(c.id,true)}).catch(()=>{})}});
(async()=>{
 salvaNovos();
 await carregarEstado();
 api("/api/modelos?agente=claude").then(m=>{MODELOS.claude=m.map(x=>({id:x.id,nome:x.id?x.nome:"Account default"}));if(CHAT)desenharCab()}).catch(()=>{});
 api("/api/modelos?agente=agy").then(m=>{MODELOS.agy=m;if(CHAT)desenharCab()}).catch(()=>{});
 api("/api/contas/status").then(()=>carregarEstado()).catch(()=>{});
 carregarUso();
 const h=location.hash.match(/c=([a-f0-9]{12})/);
 if(location.hash==="#celular")celular();
 if(location.hash.startsWith("#uso"))dlgUso(location.hash.includes("tokens")?"tokens":"limites");
 if(h)abrir(h[1]);else if(EST.chats.length)abrir(EST.chats[0].id);else desenharMsgs();
})();
</script>
</body>
</html>
